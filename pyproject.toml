[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic/versions/ is autogenerated; not held to the same style rules.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: flake8-bugbear's "no function calls in argument defaults" — the
# standard, required way to use FastAPI's Depends()/Header() dependency
# injection is exactly that pattern, so this would flag every route.
ignore = ["B008"]

