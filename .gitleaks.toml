# Secret scanning. Exact values are allowed because they are
# not secrets: the throwaway encryption key, the throwaway API keys, the sha256
# of "test" and a fake Matrix token that the tests use, and the dummy API key
# the CI job used to start the image (the job now generates one, the old value
# stays in the history). Allowing the exact
# values, and not whole files, means a real key pasted next to them is still
# caught.
title = "ChannelAgent gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Values that are not secrets"
regexes = [
  'PmKTledxEc-gdO4tty5QO4PjB48zp_GqWMVIpigdwEg=',
  'ci-key-0123456789abcdef',
  'Zq8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'SECRk3Jf9Zq2Lm8Xw5Tn7Vb4Hd6Gs1Yc',
  '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08',
  'syt_abc123_def456',
  'Test-Only-Passw0rd-Value',
  # Throwaway API keys and helper secrets of the tests added on 2026-09-27, when the CI scan
  # was disabled (found by the final audit), and a model name the generic rule reads
  # as a key.
  'Ex8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'Tb8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'Sk8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'Sq7vT3mK9xW2pL7nR4bY6cH1dF5gJ0sAZ',
  'Rq8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'Eq8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'Tq8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'Uq8vT3mK9xW2pL7nR4bY6cH1dF5gJ0sA',
  'Hq7vT3mK9xW2pL7nR4bY6cH1dF5gJ0sAZ',
  'Tq9vT3mK9xW2pL7nR4bY6cH1dF5gJ0sB',
  'Ternary-Bonsai-2-27B',
]
