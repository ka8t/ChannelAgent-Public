version: 2
updates:
  # The locks are requirements.txt / requirements-dev.txt, compiled from the
  # .in files with pip-tools. Dependabot opens one grouped pull request per
  # week; the CI (tests and pip-audit) must pass before it is merged.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
